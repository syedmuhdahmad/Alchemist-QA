# Example only. The real pipelines are in plugins/qa/pipelines.yaml.
pipelines:
  feature:
    stages:
      - id: intake
        agent: qa-lead
        exit: [basis]
      - id: automate
        agent: automation-engineer
        parallel: true
        exit: [cases-automated]
      - id: review
        agent: test-reviewer
        when: risk >= medium
        exit: [review-recorded]
